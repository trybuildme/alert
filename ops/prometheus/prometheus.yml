# Prometheus scrape config for NOAH.
# The backend exposes text-format metrics at /metrics (health-tier:
# no auth, no rate limit) — see backend/app/api/metrics.py.

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    service: noah

scrape_configs:
  - job_name: noah-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8002"]
