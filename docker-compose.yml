version: "3.9"

services:
  backend:
    build: ./backend
    container_name: noah-backend
    ports:
      - "8002:8002"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - NOAH_TILE_CACHE_DIR=/data/tilecache
    volumes:
      - tilecache:/data/tilecache
      - eqdata:/app/data
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ""
    container_name: noah-frontend
    ports:
      - "3010:80"
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: noah-redis
    ports:
      - "6380:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    restart: unless-stopped

volumes:
  tilecache:
  redisdata:
  eqdata:
