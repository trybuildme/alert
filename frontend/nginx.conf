server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /tiles/ {
        proxy_pass http://backend:8002;
        proxy_cache_valid 200 86400s;
        add_header Cache-Control "public, max-age=86400";
    }

    location /api/ {
        proxy_pass http://backend:8002;
    }
}
